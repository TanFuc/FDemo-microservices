app:
  name: profile-service
  env: development
  port: "3002"
  api_prefix: api/v1
  cors_origins:
    - "*"
  debug: true
  internal_service_key: ""

mongodb:
  uri: mongodb://localhost:27017
  database: profile_service
  connect_timeout: 10s
  max_pool_size: 100
  min_pool_size: 10

nats:
  url: nats://localhost:4222
