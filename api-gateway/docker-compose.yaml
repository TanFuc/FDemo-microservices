version: '3.8'

services:
  api-gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-key-change-in-production}
      - CATALOG_URL=http://catalog-service:3000
      - CART_URL=http://cart-service:3000
      - ORDER_URL=http://order-service:3000
      - IDENTITY_URL=http://identity-service:3000
    depends_on:
      - redis
    networks:
      - gateway-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - gateway-network
    restart: unless-stopped

networks:
  gateway-network:
    driver: bridge

volumes:
  redis-data:
