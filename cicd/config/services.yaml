# cicd/config/services.yaml
# =================================================================
# TAFU Microservices — Central Service Registry
# This is the ONLY place to declare service metadata.
# All Jenkins jobs read from this file at runtime.
# =================================================================

project:
  name: tafu
  go_version: "1.22"
  alpine_version: "3.19"

# Harbor registry — values come from Jenkins credentials at runtime
harbor:
  registry: "${HARBOR_URL}"         # Jenkins credential: harbor.registry.url
  project: "${HARBOR_PROJECT}"      # Jenkins credential: harbor.registry.project
  # Full image path = harbor.registry/harbor.project/service.image

services:
  api-gateway:
    dir: api-gateway
    image: tafu/api-gateway
    http_port: 8080
    grpc_port: ""
    main_path: ./cmd/gateway
    binary_name: api-gateway
    health_path: /health
    swarm_service:
      production: tafu_api-gateway
      staging: tafu-stg_api-gateway
    deploy:
      production_replicas: 3
      staging_replicas: 1
      cpu_limit: "0.5"
      memory_limit: "256m"
    watch_paths:
      - api-gateway
      - pkg

  auth:
    dir: auth
    image: tafu/auth-service
    http_port: 3001
    grpc_port: "50051"
    main_path: ./cmd/api
    binary_name: tafu-auth
    health_path: /health/live
    swarm_service:
      production: tafu_auth
      staging: tafu-stg_auth
    deploy:
      production_replicas: 2
      staging_replicas: 1
      cpu_limit: "0.5"
      memory_limit: "512m"
    watch_paths:
      - auth
      - pkg

