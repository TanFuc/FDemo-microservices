# Production Environment Overrides for nexus-service
replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 15
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

pdb:
  enabled: true
  minAvailable: 2

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

ingress:
  hosts:
    - host: api.nexuscommerce.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: nexus-prod-tls
      hosts:
        - api.nexuscommerce.com

env:
  ENVIRONMENT: production
  LOG_LEVEL: info
  METRICS_ENABLED: "true"
